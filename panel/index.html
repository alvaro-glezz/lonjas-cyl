<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Panel de visitas · Lonjas CyL</title>
<link rel="icon" href="../icons/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="cab"><div><h1>Panel de visitas</h1><p>Lonjas CyL · recuento anónimo, sin cookies</p></div>
  <div class="controles" id="controles" hidden>
    <label>Periodo <select id="dias"><option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option></select></label>
    <button type="button" id="salir" class="sec">Salir</button>
  </div>
</header>
<main id="main">
  <form id="acceso" class="acceso">
    <label for="clave">Contraseña del panel</label>
    <input id="clave" type="password" autocomplete="current-password" required minlength="12">
    <label class="recordar"><input id="recordar" type="checkbox"> Recordarla en este dispositivo</label>
    <button type="submit">Entrar</button>
    <p id="error" class="error" role="alert"></p>
    <p class="nota">Es la variable <code>PANEL_CLAVE</code> que pusiste en Vercel. Esta página no aparece en Google.</p>
  </form>
  <div id="panel" hidden></div>
</main>
<script src="panel.js"></script>
</body>
</html>
