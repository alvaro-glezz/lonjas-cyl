# Pruebas del robot en cada propuesta de cambio (pull request). En main ya las pasa la tarea «Actualizar precios»
# antes de leer las lonjas.
name: Pruebas del robot
on:
  pull_request:
    paths: ["scraper/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements*.txt
      - run: pip install -r scraper/requirements.txt -r scraper/requirements-pruebas.txt
      - run: python -m pytest -q scraper/pruebas
