# Pruebas del robot en cada propuesta de cambio (pull request). En main ya las pasa la tarea «Actualizar precios»
# antes de leer las lonjas.
name: Pruebas del robot
on:
  pull_request:
    paths: ["scraper/**", "api/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements*.txt
      - run: pip install -r scraper/requirements.txt -r scraper/requirements-pruebas.txt
      - run: python -m pytest -q scraper/pruebas
      - run: node scraper/pruebas/js/test_telegram_api.js > /dev/null
      - run: node scraper/pruebas/js/test_uso_api.js
      - run: node scraper/pruebas/js/test_tiempo_api.js
