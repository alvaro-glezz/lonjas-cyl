# TEMPORAL (rama diagnostico-fuentes): descarga las páginas de Salamanca y Lerma para ver dónde publican
# los boletines. Se borra en cuanto acabe el diagnóstico.
name: Diagnóstico de fuentes (temporal)
on:
  push:
    branches: [diagnostico-fuentes]
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fuentes de Salamanca (2.ª vuelta)
        run: |
          set +e
          rm -rf diag && mkdir -p diag
          UA="Mozilla/5.0 (X11; Linux x86_64) AppLonjasCyL-diagnostico"
          bajar() { curl -sSL -A "$UA" --max-time 60 -o "diag/$1" -w "$1 %{http_code} %{content_type} %{size_download} %{url_effective}\n" "$2" >> diag/estado.txt; }
          bajar sal-cotizaciones.html "https://www.lasalina.es/Aplicaciones/lonja/Cotizaciones.jsp"
          bajar sal-lonja-sub.html "https://www.lasalina.es/lasalina/economiayhacienda/agriculturayganaderia/mercado/lonja/lonja.html"
          bajar ckan-package.json "https://datosabiertossalamanca.es/api/3/action/package_show?id=cotizaciones-semanales-de-la-lonja-de-salamanca"
          bajar ckan-dataset.html "https://datosabiertossalamanca.es/dataset/cotizaciones-semanales-de-la-lonja-de-salamanca"
          python3 - <<'PY'
          import json, re, pathlib, subprocess
          d = pathlib.Path("diag")
          try:
              pkg = json.loads((d / "ckan-package.json").read_text())["result"]
              lineas = [f"licencia: {pkg.get('license_title')} | {pkg.get('license_url')}", f"modificado: {pkg.get('metadata_modified')}"]
              for i, r in enumerate(pkg.get("resources", [])):
                  lineas.append(f"{i} | {r.get('format')} | {r.get('name')} | {r.get('last_modified') or r.get('created')} | {r.get('url')}")
              (d / "ckan-recursos.txt").write_text("\n".join(lineas))
              urls = [r["url"] for r in pkg.get("resources", []) if (r.get("format") or "").upper() in ("CSV", "JSON", "XLSX", "XLS")][:3]
          except Exception as e:
              (d / "ckan-recursos.txt").write_text(f"ERROR {e}")
              urls = []
          for u in urls:
              n = re.sub(r"[^A-Za-z0-9._-]", "_", u.rsplit("/", 1)[-1])[:60] or "recurso"
              subprocess.run(["curl", "-sSL", "-A", "Mozilla/5.0", "--max-time", "90", "-o", f"diag/ckan-{n}", "-w", f"ckan-{n} %{{http_code}} %{{content_type}} %{{size_download}} %{{url_effective}}\n", u], stdout=open("diag/estado.txt", "a"))
          for f in sorted(d.glob("*.html")):
              t = f.read_text(errors="replace")
              (f.with_suffix(".enlaces.txt")).write_text("\n".join(re.findall(r'(?:href|src|action|data)\s*=\s*["\']([^"\']+)["\']', t, re.I)))
          PY
          # recortar archivos de datos muy grandes (solo hace falta ver el formato)
          for f in diag/ckan-*; do s=$(stat -c %s "$f"); if [ "$s" -gt 400000 ]; then head -c 200000 "$f" > "$f.inicio"; tail -c 100000 "$f" > "$f.final"; rm "$f"; fi; done
          ls -la diag; cat diag/estado.txt; cat diag/ckan-recursos.txt
      - name: Guardar en la rama
        run: |
          git config user.name "diagnostico-lonjas"
          git config user.email "actions@users.noreply.github.com"
          git add diag && git commit -q -m "Diagnóstico de fuentes" && git push
