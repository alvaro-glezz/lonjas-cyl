# TEMPORAL (rama diagnostico-fuentes): descarga las páginas de Salamanca y Lerma para ver dónde publican
# los boletines. Se borra en cuanto acabe el diagnóstico.
name: Diagnóstico de fuentes (temporal)
on:
  push:
    branches: [diagnostico-fuentes]
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Boletines reales de León, Segovia, Lerma y Salamanca (para las pruebas automáticas)
        run: |
          set +e
          rm -rf diag && mkdir -p diag
          UA="AppLonjasCyL/1.0 (lector semanal de cotizaciones publicas)"
          bajar() { curl -sSL -A "$UA" --max-time 90 -o "diag/$1" -w "$1 %{http_code} %{content_type} %{size_download}\n" "$2" >> diag/estado.txt; }
          bajar leon-posts.json "https://www.lonjadeleon.es/wp-json/wp/v2/posts?per_page=40&_fields=date,title,link,content"
          bajar segovia-posts.json "https://www.fessegovia.es/wp-json/wp/v2/posts?search=precios%20lonja&per_page=5&_fields=date,title,link,content"
          bajar lerma.html "https://lerma.burgos.es/lonja"
          curl -sSL -A "$UA" --max-time 90 -r 0-300000 -o diag/salamanca-inicio.csv "https://datosabiertossalamanca.es/dataset/c914b1a6-4673-4288-8613-d077f6d5b619/resource/042beb52-4d80-4380-b073-e170364f65e7/download/agr03.csv"
          python3 - <<'PY'
          import json, re, subprocess
          try:
              e = max(json.load(open("diag/segovia-posts.json")), key=lambda x: x["date"])
              u = re.findall(r'href="([^"]+\.pdf)"', e["content"]["rendered"], re.I)[0]
              subprocess.run(["curl", "-sSL", "-A", "AppLonjasCyL/1.0", "--max-time", "90", "-o", "diag/segovia.pdf", u])
              open("diag/segovia-pdf-url.txt", "w").write(u)
          except Exception as ex:
              open("diag/segovia-pdf-url.txt", "w").write(f"ERROR {ex}")
          PY
          ls -la diag; cat diag/estado.txt
      - name: Guardar en la rama
        run: |
          git config user.name "diagnostico-lonjas"
          git config user.email "actions@users.noreply.github.com"
          git add diag && git commit -q -m "Diagnóstico de fuentes" && git push
