# TEMPORAL (rama diagnostico-fuentes): descarga las páginas de Salamanca y Lerma para ver dónde publican
# los boletines. Se borra en cuanto acabe el diagnóstico.
name: Diagnóstico de fuentes (temporal)
on:
  push:
    branches: [diagnostico-fuentes]
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Descargar páginas
        run: |
          set +e
          mkdir -p diag
          UA="Mozilla/5.0 (X11; Linux x86_64) AppLonjasCyL-diagnostico"
          bajar() { curl -sSL -A "$UA" --max-time 60 -o "diag/$1" -w "$1 %{http_code} %{content_type} %{size_download} %{url_effective}\n" "$2" >> diag/estado.txt; }
          bajar salamanca.html "https://www.lasalina.es/economiayhacienda/agriculturayganaderia/mercado/lonja/"
          bajar lasalina-buscador.html "https://www.lasalina.es/buscador.html?action=search&query=lonja&searchPage=1"
          bajar lerma.html "https://lerma.burgos.es/lonja"
          python3 - <<'PY'
          import re, pathlib
          for f in sorted(pathlib.Path("diag").glob("*.html")):
              t = f.read_text(errors="replace")
              hrefs = re.findall(r'(?:href|src|data)\s*=\s*["\']([^"\']+)["\']', t, re.I)
              (f.with_suffix(".enlaces.txt")).write_text("\n".join(hrefs))
          PY
          # PDF candidatos de las dos páginas (solo los que parecen de lonja), para ver su formato
          grep -hoiE '[^"'"'"' <>]*(pdfs/lonja|lonja[^"'"'"' <>]*)\.pdf' diag/salamanca.enlaces.txt diag/lasalina-buscador.enlaces.txt | head -3 | while read u; do
            case "$u" in http*) url="$u";; /*) url="https://www.lasalina.es$u";; *) url="https://www.lasalina.es/$u";; esac
            n=$(basename "$url" | tr -cd 'A-Za-z0-9._-'); bajar "sal-$n" "$url"; done
          grep -hoiE '[^"'"'"' <>]*\.pdf' diag/lerma.enlaces.txt | grep -vi histor | head -5 | while read u; do
            case "$u" in http*) url="$u";; /*) url="https://lerma.burgos.es$u";; *) url="https://lerma.burgos.es/$u";; esac
            n=$(basename "$url" | tr -cd 'A-Za-z0-9._-'); bajar "ler-$n" "$url"; done
          bajar ler-historico2024.pdf "https://lerma.burgos.es/sites/lerma/files/lonjahistorico2024.pdf"
          ls -la diag; cat diag/estado.txt
      - name: Texto de los PDF
        run: |
          pip install -q pdfplumber
          python3 - <<'PY'
          import pathlib, pdfplumber
          for f in sorted(pathlib.Path("diag").glob("*.pdf")):
              try:
                  with pdfplumber.open(f) as pdf:
                      n = len(pdf.pages); pags = list(range(min(2, n))) + list(range(max(2, n - 2), n))
                      txt = "\n".join(f"=== página {i+1} de {n} ===\n" + (pdf.pages[i].extract_text() or "[sin texto: ¿imagen escaneada?]") for i in pags)
                      imgs = sum(len(p.images) for p in pdf.pages[-2:])
                      txt += f"\n=== imágenes en las 2 últimas páginas: {imgs} ==="
              except Exception as e:
                  txt = f"ERROR {type(e).__name__}: {e}"
              f.with_suffix(".txt").write_text(txt)
          PY
      - name: Guardar en la rama
        run: |
          git config user.name "diagnostico-lonjas"
          git config user.email "actions@users.noreply.github.com"
          git add diag && git commit -q -m "Diagnóstico de fuentes" && git push
