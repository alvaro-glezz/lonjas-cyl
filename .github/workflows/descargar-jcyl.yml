# Prueba temporal: comprueba en GitHub que el importador descarga los Excel de la Junta.
name: Descargar Excel Junta CyL

on:
  push:
    branches: [descarga-jcyl]
    paths: [".github/workflows/descargar-jcyl.yml"]

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: historico-2026
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Borrar dos Excel y volver a descargarlos
        run: |
          set -o pipefail
          {
            echo "== Borrados"; git rm -q data/fuentes/jcyl/2026/semana-43.xlsx data/fuentes/jcyl/2025/semana-52.xlsx && echo ok
            echo "== Importar con descarga"; python scraper/importar_jcyl.py --descargar 2>&1 | grep -v "^AVISO" || true
            echo "== Comparar con el original"
            git show HEAD:data/fuentes/jcyl/2026/semana-43.xlsx | sha256sum
            sha256sum < data/fuentes/jcyl/2026/semana-43.xlsx
            git show HEAD:data/fuentes/jcyl/2025/semana-52.xlsx | sha256sum
            sha256sum < data/fuentes/jcyl/2025/semana-52.xlsx
            echo "== Cambios"; git status --short
            echo "== Validar"; python scraper/validar_historico.py
          } > /tmp/resultado.txt 2>&1 || true
          cat /tmp/resultado.txt
      - name: Guardar resultado
        run: |
          git fetch -q origin descarga-jcyl
          git checkout -q -f -B descarga-jcyl origin/descarga-jcyl
          cp /tmp/resultado.txt resultado-prueba.txt
          git config user.name "actualizador-lonjas"
          git config user.email "actions@users.noreply.github.com"
          git add resultado-prueba.txt
          git commit -q -m "Resultado de la prueba de descarga"
          git push -q origin descarga-jcyl
