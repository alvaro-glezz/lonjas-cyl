# Lee las lonjas varias veces al día (lunes a sábado) y publica los precios nuevos.
# Si nada ha cambiado, no hace nada. Se puede lanzar a mano desde la pestaña "Actions".
name: Actualizar precios

on:
  schedule:
    # Horas en UTC: 12:40, 16:40 y 20:40 (13:40, 17:40 y 21:40 en España en invierno)
    - cron: "40 12,16,20 * * 1-6"
  workflow_dispatch:
  # Cuando cambia el código del robot: pruebas y lectura en ese momento (no hay que esperar a la hora programada).
  # Los commits del propio robot no vuelven a lanzarlo (GitHub no encadena tareas hechas con GITHUB_TOKEN).
  push:
    branches: [main]
    paths:
      - "scraper/*.py"
      - "api/*.js"
      - "scraper/requirements*.txt"
      - ".github/workflows/actualizar-precios.yml"

permissions:
  contents: write
  issues: write   # para abrir y cerrar el aviso «fuentes con problemas»

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt -r scraper/requirements-pruebas.txt
      # Si el código del robot está roto, no se lee ni se publica nada (y GitHub avisa por correo del fallo).
      - name: Pruebas del robot
        run: |
          python -m pytest -q scraper/pruebas
          node scraper/pruebas/js/test_telegram_api.js > /dev/null
      - name: Leer las lonjas
        run: python scraper/actualizar.py
      # Histórico oficial de la Junta de CyL: baja los Excel semanales nuevos y rehace data/historico/.
      # Si la web de la Junta falla, los precios del día se publican igualmente.
      - name: Histórico de la Junta de Castilla y León
        id: jcyl
        continue-on-error: true
        run: python scraper/importar_jcyl.py --descargar
      # Páginas que lee Google (una por producto y por lonja) y sitemap.xml, con los precios recién leídos.
      - name: Páginas para Google
        continue-on-error: true
        run: python scraper/paginas.py
      # Datos abiertos: data/abiertos/precios.csv, historial.csv y precios.json.
      - name: Datos abiertos
        continue-on-error: true
        run: python scraper/datos_abiertos.py
      # Canal de Telegram: publica las sesiones nuevas. Sin el secreto TELEGRAM_TOKEN no hace nada.
      - name: Publicar en Telegram
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: '@lonjas_cyl'   # canal público t.me/lonjas_cyl (no es secreto)
        run: python scraper/telegram.py
      # Avisos personales del robot de Telegram («/aviso trigo 240»). Sin los secretos de Upstash no hace nada.
      - name: Avisos personales por Telegram
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python scraper/avisos_telegram.py
      - name: Guardar si hay precios nuevos
        run: |
          if [ -z "$(git status --porcelain data/ scraper/pruebas/casos/ precio/ lonja/ precios/ plazos/ sitemap.xml)" ]; then
            echo "Sin cambios"
          else
            git config user.name "actualizador-lonjas"
            git config user.email "actions@users.noreply.github.com"
            git add data/ scraper/pruebas/casos/ precio/ lonja/ precios/ plazos/ sitemap.xml
            git commit -m "Precios actualizados $(date -u +%Y-%m-%d)"
            git push
          fi
      # Abre (o cierra) una incidencia en GitHub si alguna lonja falla: llega por correo al dueño del repositorio.
      - name: Avisar si alguna fuente falla
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JCYL_RESULTADO: ${{ steps.jcyl.outcome }}
        run: python scraper/avisar.py
