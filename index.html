<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lonjas CyL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cotizaciones semanales de las lonjas agropecuarias de Castilla y León: cereales, porcino, ovino y vacuno.">
<meta name="theme-color" content="#24503c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lonjas CyL">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Concepto: la tablilla de una lonja. Columna única de lectura rápida, cifras grandes condensadas,
   navegación inferior al alcance del pulgar. Verde pino como tinta de marca, paja para lo seleccionado. */
:root {
  --fondo: #eef1ea;
  --hoja: #ffffff;
  --tinta: #18241d;
  --tenue: #5b6a60;
  --linea: #d6ddd2;
  --pino: #24503c;
  --pino-suave: #e1ebe3;
  --paja: #b9861f;
  --paja-suave: #f6ecd2;
  --sube: #23774a;
  --baja: #b3402a;
  --sube-suave: #e2f1e7;
  --baja-suave: #f7e4df;
  --aviso: #8a6a12;
  --sombra: 0 1px 2px rgba(24, 36, 29, .06), 0 4px 14px rgba(24, 36, 29, .05);
  --cifra: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --texto: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --barra: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #101612; --hoja: #18201b; --tinta: #e5ebe5; --tenue: #9aa89e; --linea: #2b362f;
    --pino: #8fc7a5; --pino-suave: #1f3329; --paja: #e0b252; --paja-suave: #3a301a;
    --sube: #6fcf97; --baja: #f08a73; --sube-suave: #183626; --baja-suave: #3d221c; --aviso: #e0b252;
    --sombra: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #101612; --hoja: #18201b; --tinta: #e5ebe5; --tenue: #9aa89e; --linea: #2b362f;
  --pino: #8fc7a5; --pino-suave: #1f3329; --paja: #e0b252; --paja-suave: #3a301a;
  --sube: #6fcf97; --baja: #f08a73; --sube-suave: #183626; --baja-suave: #3d221c; --aviso: #e0b252;
  --sombra: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--fondo); color: var(--tinta);
  font: 15px/1.45 var(--texto);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--pino);
}
button { font: inherit; color: inherit; }
a { color: var(--pino); }
:focus-visible { outline: 2px solid var(--paja); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--cifra); font-variant-numeric: tabular-nums; }

/* Cabecera */
.cabecera {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--pino); color: #f4f7f2;
  padding-block: 12px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
:root[data-theme="dark"] .cabecera { background: #1b2b22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cabecera { background: #1b2b22; } }
.cabecera-dentro { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.marca svg { flex: none; }
.marca h1 { margin: 0; font: 700 24px/1 var(--cifra); letter-spacing: .02em; text-transform: uppercase; }
.marca p { margin: 2px 0 0; font-size: 12px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-icono {
  flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25);
  background: transparent; color: inherit; display: grid; place-items: center; cursor: pointer;
}
.btn-icono:hover { background: rgba(255,255,255,.1); }
.btn-icono.girando svg { animation: gira 0.9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

/* Contenido */
main {
  max-width: 760px; margin: 0 auto;
  padding-block: 16px calc(var(--barra) + 28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px;
}
.seccion { display: grid; gap: 10px; min-width: 0; }
.titulo-seccion { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.titulo-seccion h2 { margin: 0; font: 700 20px/1.1 var(--cifra); text-transform: uppercase; letter-spacing: .04em; text-wrap: balance; }
.titulo-seccion span { font-size: 12.5px; color: var(--tenue); }
.etiqueta { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--tenue); font-weight: 600; }

/* Pizarra de productos clave */
.pizarra { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ficha {
  background: var(--hoja); border: 1px solid var(--linea); border-radius: 12px; padding: 12px;
  display: grid; gap: 6px; text-align: left; cursor: pointer; min-width: 0;
}
.ficha:hover { border-color: var(--pino); }
.ficha .nombre { font-weight: 600; font-size: 14px; }
.ficha .valor { font: 600 30px/1 var(--cifra); }
.ficha .valor small { font: 500 13px var(--texto); color: var(--tenue); margin-left: 3px; }
.ficha .rango { font-size: 12px; color: var(--tenue); }
.ficha .pastilla { justify-self: start; }

/* Tarjetas de lonja */
.lonjas { display: grid; gap: 10px; }
.lonja {
  background: var(--hoja); border-radius: 14px; box-shadow: var(--sombra); border: 1px solid var(--linea);
  padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; text-align: left; cursor: pointer; width: 100%;
}
.lonja:hover { border-color: var(--pino); }
.lonja h3 { margin: 0; font: 700 21px/1.1 var(--cifra); letter-spacing: .02em; }
.lonja .meta { color: var(--tenue); font-size: 13px; }
.lonja .cifras { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.lonja.apagada { cursor: default; box-shadow: none; background: transparent; }
.lonja.apagada:hover { border-color: var(--linea); }
.pastilla {
  display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px;
  font-size: 12px; font-weight: 600; white-space: nowrap; align-self: start;
}
.p-dia { background: var(--sube-suave); color: var(--sube); }
.p-pend { background: var(--paja-suave); color: var(--aviso); }
.p-off { background: var(--linea); color: var(--tenue); }
.p-err { background: var(--baja-suave); color: var(--baja); }
.p-sube { background: var(--sube-suave); color: var(--sube); }
.p-baja { background: var(--baja-suave); color: var(--baja); }
.p-igual { background: var(--pino-suave); color: var(--tenue); }

/* Tablilla */
.cab-lonja { display: grid; gap: 4px; }
.volver { justify-self: start; background: none; border: 0; color: var(--pino); font-weight: 600; padding: 4px 0; cursor: pointer; }
.cab-lonja h2 { margin: 0; font: 700 32px/1 var(--cifra); text-transform: uppercase; letter-spacing: .02em; }
.filtros { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip {
  flex: none; border: 1px solid var(--linea); background: var(--hoja); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--tinta);
}
.chip[aria-pressed="true"] { background: var(--paja-suave); border-color: var(--paja); color: var(--tinta); }
.buscar {
  width: 100%; border: 1px solid var(--linea); background: var(--hoja); color: var(--tinta);
  border-radius: 10px; padding: 10px 12px; font: inherit;
}
.tablilla { background: var(--hoja); border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
.mesa {
  margin: 0; padding: 9px 14px; background: var(--pino-suave); color: var(--pino);
  font: 700 15px/1.2 var(--cifra); text-transform: uppercase; letter-spacing: .08em;
  border-top: 1px solid var(--linea);
}
.mesa:first-child { border-top: 0; }
.fila {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; align-items: center; gap: 4px 10px;
  padding: 10px 14px 10px 8px; border-top: 1px solid var(--linea); width: 100%;
  background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer;
}
.mesa + .fila { border-top: 0; }
.fila:hover { background: color-mix(in srgb, var(--pino-suave) 50%, transparent); }
.estrella {
  width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: none; cursor: pointer;
  color: var(--linea); border-radius: 8px;
}
.estrella[aria-pressed="true"] { color: var(--paja); }
.estrella:hover { color: var(--paja); }
.prod { min-width: 0; }
.prod b { font-weight: 600; display: block; overflow-wrap: anywhere; }
.prod small { color: var(--tenue); font-size: 12px; }
.precio { font: 600 24px/1 var(--cifra); text-align: right; white-space: nowrap; }
.precio.sc { font: 600 14px var(--texto); color: var(--tenue); }
.var { min-width: 64px; text-align: right; font: 600 15px/1 var(--cifra); white-space: nowrap; }
.var.s { color: var(--sube); } .var.b { color: var(--baja); } .var.i { color: var(--tenue); }
.fuente { font-size: 12.5px; color: var(--tenue); }

/* Comparar */
.comparativa { background: var(--hoja); border: 1px solid var(--linea); border-radius: 14px; padding: 6px 14px 12px; }
.cmp-fila { display: grid; grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--linea); }
.cmp-fila:last-child { border-bottom: 0; }
.cmp-fila .q { font-size: 12px; color: var(--tenue); grid-column: 1 / -1; margin-top: -6px; }
.barra-cmp { height: 12px; border-radius: 6px; background: var(--pino-suave); overflow: hidden; }
.barra-cmp i { display: block; height: 100%; background: var(--pino); border-radius: 6px; }
.barra-cmp i.mejor { background: var(--paja); }
.cmp-valor { text-align: right; font: 600 22px/1 var(--cifra); white-space: nowrap; }
.cmp-valor small { display: block; font: 600 13px var(--cifra); }
.nota { font-size: 13px; color: var(--tenue); max-width: 62ch; margin: 0; }
.vacio { background: var(--hoja); border: 1px dashed var(--linea); border-radius: 14px; padding: 22px; text-align: center; color: var(--tenue); }
.vacio b { display: block; color: var(--tinta); font-size: 16px; margin-bottom: 4px; }

/* Barra inferior */
.navegacion {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--hoja); border-top: 1px solid var(--linea);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.navegacion ul { list-style: none; margin: 0 auto; padding: 0; max-width: 760px; display: grid; grid-template-columns: repeat(4, 1fr); }
.navegacion a {
  height: var(--barra); display: grid; place-items: center; align-content: center; gap: 3px;
  text-decoration: none; color: var(--tenue); font-size: 12px; font-weight: 600;
}
.navegacion a[aria-current="page"] { color: var(--pino); }
.navegacion a[aria-current="page"] svg { stroke: var(--pino); }

/* Hoja de detalle */
.velo { position: fixed; inset: 0; background: rgba(10, 16, 12, .45); z-index: 20; display: grid; align-items: end; justify-items: center; }
.hoja-detalle {
  width: min(760px, 100%); max-height: 88vh; overflow: auto; background: var(--hoja); color: var(--tinta);
  border-radius: 18px 18px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px;
}
.hoja-detalle header { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.hoja-detalle h3 { margin: 0; font: 700 26px/1.05 var(--cifra); }
.cerrar { border: 1px solid var(--linea); background: var(--hoja); border-radius: 10px; width: 38px; height: 38px; cursor: pointer; flex: none; }
.datos-det { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.datos-det div { background: var(--fondo); border-radius: 10px; padding: 10px; }
.datos-det b { display: block; font: 600 24px/1.1 var(--cifra); }
.grafico svg { width: 100%; height: auto; display: block; }
.serie { display: grid; gap: 0; max-height: 220px; overflow: auto; border: 1px solid var(--linea); border-radius: 10px; }
.serie div { display: flex; justify-content: space-between; padding: 7px 12px; border-top: 1px solid var(--linea); font-variant-numeric: tabular-nums; }
.serie div:first-child { border-top: 0; }

.aviso-red { background: var(--paja-suave); color: var(--tinta); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }

@media (min-width: 640px) {
  .lonjas { grid-template-columns: 1fr 1fr; }
  .datos-det b { font-size: 28px; }
}
@media (max-width: 380px) {
  .var { min-width: 52px; }
  .precio { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="cabecera">
  <div class="cabecera-dentro">
    <div class="marca">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#f4f7f2" opacity=".14"/><path d="M32 54V14" stroke="#e0b252" stroke-width="3" stroke-linecap="round"/><g fill="#e0b252"><ellipse cx="32" cy="12" rx="3.3" ry="7"/><ellipse cx="27" cy="22" rx="3.3" ry="7" transform="rotate(-32 27 22)"/><ellipse cx="37" cy="22" rx="3.3" ry="7" transform="rotate(32 37 22)"/><ellipse cx="27" cy="31" rx="3.3" ry="7" transform="rotate(-32 27 31)"/><ellipse cx="37" cy="31" rx="3.3" ry="7" transform="rotate(32 37 31)"/><ellipse cx="27" cy="40" rx="3.3" ry="7" transform="rotate(-32 27 40)"/><ellipse cx="37" cy="40" rx="3.3" ry="7" transform="rotate(32 37 40)"/></g></svg>
      <div style="min-width:0">
        <h1>Lonjas CyL</h1>
        <p id="actualizado">Cargando cotizaciones…</p>
      </div>
    </div>
    <button class="btn-icono" id="recargar" type="button" aria-label="Buscar precios nuevos" title="Buscar precios nuevos">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>

<main id="vista" aria-live="polite"></main>

<nav class="navegacion" aria-label="Secciones">
  <ul>
    <li><a href="#hoy" data-vista="hoy"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoy</a></li>
    <li><a href="#lonjas" data-vista="lonjas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Lonjas</a></li>
    <li><a href="#comparar" data-vista="comparar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Comparar</a></li>
    <li><a href="#favoritos" data-vista="favoritos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg>Favoritos</a></li>
  </ul>
</nav>

<div id="velo" class="velo" hidden></div>

<script>
"use strict";
const RUTA_DATOS = "data/precios.json";
const PRODUCTOS_CLAVE = [
  ["trigo", "Trigo"], ["cebada", "Cebada"], ["maiz", "Maíz"], ["avena", "Avena"], ["centeno", "Centeno"],
  ["triticale", "Triticale"], ["girasol", "Girasol"], ["alfalfa", "Alfalfa"], ["paja", "Paja"],
  ["cerdo-normal", "Cerdo normal"], ["cerdo-selecto", "Cerdo selecto"], ["lechones", "Lechones"], ["lechazo", "Lechazo"],
];
const RESUMEN = ["trigo", "cebada", "maiz", "cerdo-normal", "lechones", "lechazo"];
const $ = (s, el = document) => el.querySelector(s);
let DATOS = null;
let estado = { cat: "Todas", texto: "", clave: "trigo" };

/* ---------- almacenamiento local (favoritos) ---------- */
function leerFavs() { try { return new Set(JSON.parse(localStorage.getItem("lonjas-favoritos") || "[]")); } catch { return new Set(); } }
function guardarFavs(s) { try { localStorage.setItem("lonjas-favoritos", JSON.stringify([...s])); } catch {} }
let FAVS = leerFavs();

/* ---------- formato ---------- */
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
function fechaCorta(iso) { if (!iso) return "—"; const [a, m, d] = iso.split("-").map(Number); return `${d} ${MESES[m - 1]}`; }
function fechaLarga(iso) { if (!iso) return "—"; const f = new Date(iso + "T12:00:00"); return `${DIAS[f.getDay()]} ${f.getDate()} ${MESES[f.getMonth()]} ${f.getFullYear()}`; }
function decimales(v, unidad) {
  if (/€\/t/.test(unidad) || Math.abs(v) >= 100) return Number.isInteger(v) ? 0 : 2;
  const s = String(v).split(".")[1] || "";
  return Math.max(2, Math.min(s.length, 5));
}
function precio(v, unidad) {
  if (v == null) return "S/C";
  return v.toLocaleString("es-ES", { minimumFractionDigits: decimales(v, unidad), maximumFractionDigits: decimales(v, unidad) });
}
function variacion(f) {
  if (f.act == null || f.ant == null) return { txt: f.act == null ? "" : "nuevo", clase: "i", d: 0 };
  const d = Math.round((f.act - f.ant) * 100000) / 100000;
  if (d === 0) return { txt: "=", clase: "i", d };
  const dec = decimales(Math.abs(d) < 1 ? f.act : d, f.unidad);
  const txt = (d > 0 ? "▲ +" : "▼ −") + Math.abs(d).toLocaleString("es-ES", { minimumFractionDigits: Math.min(dec, 3), maximumFractionDigits: 3 });
  return { txt, clase: d > 0 ? "s" : "b", d };
}
function diasDesde(iso) { return Math.floor((Date.now() - new Date(iso + "T12:00:00")) / 86400000); }
function estadoLonja(l) {
  if (l.estado === "suspendida") return { txt: "Sin cotizar", clase: "p-off" };
  if (l.error && diasDesde(l.fecha) > 8) return { txt: "Revisar fuente", clase: "p-err" };
  if (!l.fecha) return { txt: "Sin datos", clase: "p-off" };
  return diasDesde(l.fecha) <= 7 ? { txt: "Al día", clase: "p-dia" } : { txt: "Pendiente", clase: "p-pend" };
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const icoEstrella = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg>';

/* ---------- datos ---------- */
function todasLasFilas() { return DATOS.lonjas.flatMap(l => l.precios.map(f => ({ ...f, lonja: l }))); }
function buscarFila(id) { return todasLasFilas().find(f => f.id === id); }

async function cargar(forzar = false) {
  const btn = $("#recargar"); btn.classList.add("girando");
  try {
    const r = await fetch(RUTA_DATOS + (forzar ? "?t=" + Date.now() : ""), { cache: forzar ? "no-store" : "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATOS = await r.json();
    try { localStorage.setItem("lonjas-copia", JSON.stringify(DATOS)); } catch {}
    DATOS.__sinRed = false;
  } catch (e) {
    let copia = null;
    try { copia = JSON.parse(localStorage.getItem("lonjas-copia") || "null"); } catch {}
    if (copia) { DATOS = copia; DATOS.__sinRed = true; }
    else if (!DATOS) { $("#vista").innerHTML = `<div class="vacio"><b>No se han podido cargar las cotizaciones</b>Comprueba la conexión y pulsa el botón de actualizar, arriba a la derecha.</div>`; }
  } finally { btn.classList.remove("girando"); }
  if (DATOS) { pintarCabecera(); router(); }
}

function pintarCabecera() {
  const g = DATOS.generado ? new Date(DATOS.generado) : null;
  $("#actualizado").textContent = (DATOS.__sinRed ? "Sin conexión · " : "") +
    (g ? `Revisado ${g.getDate()} ${MESES[g.getMonth()]}, ${String(g.getHours()).padStart(2, "0")}:${String(g.getMinutes()).padStart(2, "0")} h` : "");
}

/* ---------- vistas ---------- */
function vistaHoy() {
  const filas = todasLasFilas();
  const fichas = RESUMEN.map(clave => {
    const nombre = PRODUCTOS_CLAVE.find(p => p[0] === clave)[1];
    const v = filas.filter(f => f.clave === clave && f.act != null);
    if (!v.length) return "";
    const media = v.reduce((s, f) => s + f.act, 0) / v.length;
    const min = Math.min(...v.map(f => f.act)), max = Math.max(...v.map(f => f.act));
    const subidas = v.filter(f => variacion(f).d > 0).length, bajadas = v.filter(f => variacion(f).d < 0).length;
    const tend = bajadas > subidas ? '<span class="pastilla p-baja">▼ baja</span>' : subidas > bajadas ? '<span class="pastilla p-sube">▲ sube</span>' : '<span class="pastilla p-igual">= estable</span>';
    return `<button class="ficha" type="button" data-clave="${clave}">
      <span class="nombre">${nombre}</span>
      <span class="valor num">${precio(Math.round(media * 1000) / 1000, v[0].unidad)}<small>${esc(v[0].unidad)}</small></span>
      <span class="rango">${v.length > 1 ? `media de ${v.length} lonjas · ${precio(min, v[0].unidad)}–${precio(max, v[0].unidad)}` : `solo ${esc(v[0].lonja.nombre.replace("Lonja de ", ""))}`}</span>
      ${tend}</button>`;
  }).join("");
  return `
    ${DATOS.__sinRed ? '<p class="aviso-red">Estás sin conexión. Se muestran los últimos precios guardados en este teléfono.</p>' : ""}
    <section class="seccion">
      <div class="titulo-seccion"><h2>Pizarra de la semana</h2><span>Toca un producto para comparar</span></div>
      <div class="pizarra">${fichas}</div>
    </section>
    <section class="seccion">
      <div class="titulo-seccion"><h2>Lonjas</h2><span>Última sesión de cada una</span></div>
      ${listaLonjas()}
    </section>
    <p class="nota">Precios orientativos publicados por cada lonja. Cada lonja cotiza en sus propias condiciones (calidad, punto de entrega, peso), así que los valores no siempre son comparables entre sí.</p>`;
}

function listaLonjas() {
  const orden = [...DATOS.lonjas].sort((a, b) => (b.estado !== "suspendida") - (a.estado !== "suspendida") || (b.fecha || "").localeCompare(a.fecha || ""));
  return `<div class="lonjas">${orden.map(l => {
    const e = estadoLonja(l);
    if (l.estado === "suspendida") {
      return `<div class="lonja apagada"><div><h3>${esc(l.nombre)}</h3><div class="meta">${esc(l.nota || "Sin cotizaciones activas")}</div></div><span class="pastilla ${e.clase}">${e.txt}</span></div>`;
    }
    const subes = l.precios.filter(f => variacion(f).d > 0).length, bajas = l.precios.filter(f => variacion(f).d < 0).length;
    const iguales = l.precios.filter(f => f.act != null && variacion(f).d === 0 && f.ant != null).length;
    return `<button class="lonja" type="button" data-lonja="${l.id}">
      <div><h3>${esc(l.nombre)}</h3><div class="meta">Sesión del ${fechaLarga(l.fecha)} · cotiza los ${esc(l.dia).toLowerCase()}</div></div>
      <span class="pastilla ${e.clase}">${e.txt}</span>
      <div class="cifras"><span class="pastilla p-sube">▲ ${subes}</span><span class="pastilla p-baja">▼ ${bajas}</span><span class="pastilla p-igual">= ${iguales}</span><span class="pastilla p-igual">${l.precios.length} precios</span></div>
    </button>`;
  }).join("")}</div>`;
}

function vistaLonjas() {
  return `<section class="seccion"><div class="titulo-seccion"><h2>Todas las lonjas</h2><span>Castilla y León</span></div>${listaLonjas()}</section>`;
}

function filaHTML(f, conLonja = false) {
  const v = variacion(f);
  const fav = FAVS.has(f.id);
  return `<div class="fila" role="button" tabindex="0" data-fila="${f.id}">
    <button class="estrella" type="button" data-fav="${f.id}" aria-pressed="${fav}" aria-label="${fav ? "Quitar de" : "Añadir a"} favoritos">${icoEstrella}</button>
    <span class="prod"><b>${esc(f.producto)}</b><small>${conLonja ? esc(f.lonja.nombre.replace("Lonja de ", "")) + " · " : ""}${esc(f.unidad)}${f.rango ? " · " + esc(f.rango) : ""}</small></span>
    <span class="precio num ${f.act == null ? "sc" : ""}">${precio(f.act, f.unidad)}</span>
    <span class="var ${v.clase}">${v.txt}</span>
  </div>`;
}

function vistaLonja(id) {
  const l = DATOS.lonjas.find(x => x.id === id);
  if (!l) return vistaHoy();
  const cats = ["Todas", ...new Set(l.precios.map(f => f.cat))];
  if (!cats.includes(estado.cat)) estado.cat = "Todas";
  const t = estado.texto.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const visibles = l.precios.filter(f => (estado.cat === "Todas" || f.cat === estado.cat) &&
    (!t || f.producto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").includes(t)));
  let cuerpo = "", catActual = null;
  for (const f of visibles) {
    if (f.cat !== catActual) { catActual = f.cat; cuerpo += `<h3 class="mesa">${esc(f.cat)}</h3>`; }
    cuerpo += filaHTML(f);
  }
  const e = estadoLonja(l);
  return `
    <section class="seccion">
      <div class="cab-lonja">
        <button class="volver" type="button" data-ir="hoy">‹ Volver</button>
        <h2>${esc(l.nombre)}</h2>
        <div class="meta"><span class="pastilla ${e.clase}">${e.txt}</span> &nbsp;Sesión del ${fechaLarga(l.fecha)}</div>
      </div>
      <div class="filtros" role="group" aria-label="Mesas">${cats.map(c => `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c === estado.cat}">${esc(c)}</button>`).join("")}</div>
      <input id="buscar-producto" class="buscar" type="search" placeholder="Buscar producto (trigo, cordero, vacas…)" value="${esc(estado.texto)}" aria-label="Buscar producto">
      <div class="tablilla">${cuerpo || '<div class="vacio" style="border:0"><b>Nada coincide</b>Prueba con otra palabra o elige «Todas».</div>'}</div>
      <p class="fuente">Fuente: ${l.fuente ? `<a href="${esc(l.fuente)}" target="_blank" rel="noopener">publicación oficial de la lonja</a>` : "lonja"}${l.origen === "carga manual" ? " · cargado a mano" : ""}${l.error ? " · La última lectura automática falló; se muestran los precios de la sesión indicada." : ""}</p>
    </section>`;
}

function vistaComparar() {
  const filas = todasLasFilas();
  const disponibles = PRODUCTOS_CLAVE.filter(([c]) => filas.some(f => f.clave === c));
  const v = filas.filter(f => f.clave === estado.clave);
  const conPrecio = v.filter(f => f.act != null);
  const max = Math.max(...conPrecio.map(f => f.act), 0);
  const mejor = conPrecio.length ? Math.max(...conPrecio.map(f => f.act)) : null;
  const filasCmp = [...v].sort((a, b) => (b.act ?? -1) - (a.act ?? -1)).map(f => {
    const va = variacion(f);
    return `<div class="cmp-fila" role="button" tabindex="0" data-fila="${f.id}">
      <span><b>${esc(f.lonja.nombre.replace("Lonja de ", ""))}</b><br><small class="etiqueta">${fechaCorta(f.lonja.fecha)}</small></span>
      <div class="barra-cmp" aria-hidden="true"><i class="${f.act === mejor ? "mejor" : ""}" style="width:${f.act == null ? 0 : Math.max(4, f.act / max * 100)}%"></i></div>
      <span class="cmp-valor num">${precio(f.act, f.unidad)}<small class="var ${va.clase}">${va.txt}</small></span>
      <span class="q">${esc(f.producto)} · ${esc(f.unidad)}</span>
    </div>`;
  }).join("");
  return `
    <section class="seccion">
      <div class="titulo-seccion"><h2>Comparar lonjas</h2><span>Mismo producto, distintas lonjas</span></div>
      <div class="filtros" role="group" aria-label="Producto">${disponibles.map(([c, n]) => `<button class="chip" type="button" data-clave-cmp="${c}" aria-pressed="${c === estado.clave}">${n}</button>`).join("")}</div>
      <div class="comparativa">${filasCmp || '<div class="vacio" style="border:0">No hay cotizaciones de este producto ahora mismo.</div>'}</div>
      <p class="nota">La barra dorada marca el precio más alto. Fíjate en la descripción bajo cada lonja: un «trigo pienso» en almacén y un «trigo tipo III» en origen no son exactamente el mismo producto.</p>
    </section>`;
}

function vistaFavoritos() {
  const filas = todasLasFilas().filter(f => FAVS.has(f.id));
  return `<section class="seccion">
    <div class="titulo-seccion"><h2>Mis precios</h2><span>${filas.length} guardado${filas.length === 1 ? "" : "s"}</span></div>
    ${filas.length ? `<div class="tablilla">${filas.map(f => filaHTML(f, true)).join("")}</div>` :
      `<div class="vacio"><b>Aún no tienes precios guardados</b>Abre una lonja y toca la estrella junto a los productos que vendes o compras. Aparecerán aquí, juntos.</div>`}
  </section>`;
}

/* ---------- detalle con gráfico ---------- */
function grafico(serie, unidad) {
  if (serie.length < 2) return '<p class="nota">El histórico se irá llenando cada semana con las nuevas sesiones.</p>';
  const W = 420, H = 200, mi = { l: 50, r: 12, t: 12, b: 28 };
  const vals = serie.map(p => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.15 || Math.abs(hi) * 0.02 || 1; lo -= pad; hi += pad;
  const t0 = new Date(serie[0][0]).getTime(), t1 = new Date(serie.at(-1)[0]).getTime();
  const x = t => mi.l + (new Date(t).getTime() - t0) / (t1 - t0 || 1) * (W - mi.l - mi.r);
  const y = v => mi.t + (hi - v) / (hi - lo) * (H - mi.t - mi.b);
  const pts = serie.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  const area = `${mi.l},${H - mi.b} ${pts} ${x(serie.at(-1)[0]).toFixed(1)},${H - mi.b}`;
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad];
  const u = serie.at(-1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del precio">
    ${ticks.map(v => `<line x1="${mi.l}" x2="${W - mi.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linea)" stroke-width="1"/>
      <text x="${mi.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="13" fill="var(--tenue)" font-family="var(--cifra)">${precio(Math.round(v * 1000) / 1000, unidad)}</text>`).join("")}
    <polygon points="${area}" fill="var(--pino)" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--pino)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${serie.map(p => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3" fill="var(--hoja)" stroke="var(--pino)" stroke-width="1.5"/>`).join("")}
    <circle cx="${x(u[0])}" cy="${y(u[1])}" r="6" fill="var(--paja)" stroke="var(--hoja)" stroke-width="2"/>
    <text x="${mi.l}" y="${H - 8}" font-size="13" fill="var(--tenue)">${fechaCorta(serie[0][0])}</text>
    <text x="${W - mi.r}" y="${H - 8}" font-size="13" fill="var(--tenue)" text-anchor="end">${fechaCorta(u[0])}</text>
  </svg>`;
}

function abrirDetalle(id) {
  const f = buscarFila(id); if (!f) return;
  const serie = (DATOS.historial?.[id] || []).filter(p => p[0] && p[1] != null);
  const vals = serie.map(p => p[1]);
  const v = variacion(f);
  const velo = $("#velo");
  velo.innerHTML = `<div class="hoja-detalle" role="dialog" aria-modal="true" aria-labelledby="det-titulo">
    <header><div><div class="etiqueta">${esc(f.lonja.nombre)} · ${esc(f.cat)}</div><h3 id="det-titulo">${esc(f.producto)}</h3></div>
      <button class="cerrar" type="button" data-cerrar aria-label="Cerrar">✕</button></header>
    <div class="datos-det">
      <div><span class="etiqueta">Actual</span><b class="num">${precio(f.act, f.unidad)}</b><small>${esc(f.unidad)}</small></div>
      <div><span class="etiqueta">Anterior</span><b class="num">${precio(f.ant, f.unidad)}</b><small class="var ${v.clase}">${v.txt}</small></div>
      <div><span class="etiqueta">${serie.length > 1 ? "Mín · máx" : "Sesión"}</span><b class="num" style="font-size:20px">${serie.length > 1 ? precio(Math.min(...vals), f.unidad) + " · " + precio(Math.max(...vals), f.unidad) : fechaCorta(f.lonja.fecha)}</b><small>${serie.length > 1 ? serie.length + " sesiones" : ""}</small></div>
    </div>
    <div class="grafico">${grafico(serie, f.unidad)}</div>
    ${serie.length > 1 ? `<div class="serie">${[...serie].reverse().map(p => `<div><span>${fechaLarga(p[0])}</span><b class="num">${precio(p[1], f.unidad)}</b></div>`).join("")}</div>` : ""}
    <button class="chip" type="button" data-fav="${f.id}" aria-pressed="${FAVS.has(f.id)}" style="justify-self:start">${FAVS.has(f.id) ? "★ En favoritos" : "☆ Añadir a favoritos"}</button>
  </div>`;
  velo.hidden = false;
  $(".cerrar", velo).focus();
}
function cerrarDetalle() { const v = $("#velo"); v.hidden = true; v.innerHTML = ""; }

/* ---------- navegación ---------- */
function router() {
  if (!DATOS) return;
  const h = location.hash.slice(1) || "hoy";
  let html, seccion = h;
  if (h.startsWith("lonja-")) { html = vistaLonja(h.slice(6)); seccion = "lonjas"; }
  else if (h === "lonjas") html = vistaLonjas();
  else if (h === "comparar") html = vistaComparar();
  else if (h === "favoritos") html = vistaFavoritos();
  else { html = vistaHoy(); seccion = "hoy"; }
  $("#vista").innerHTML = html;
  document.querySelectorAll(".navegacion a").forEach(a => a.dataset.vista === seccion ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}
function ir(h) { if (location.hash.slice(1) === h) router(); else location.hash = h; window.scrollTo(0, 0); }

document.addEventListener("click", e => {
  const t = e.target;
  const fav = t.closest("[data-fav]");
  if (fav) {
    e.stopPropagation();
    const id = fav.dataset.fav;
    FAVS.has(id) ? FAVS.delete(id) : FAVS.add(id); guardarFavs(FAVS);
    if (!$("#velo").hidden) abrirDetalle(id);
    router(); return;
  }
  if (t.closest("[data-cerrar]") || t === $("#velo")) return cerrarDetalle();
  const lj = t.closest("[data-lonja]"); if (lj) { estado.cat = "Todas"; estado.texto = ""; return ir("lonja-" + lj.dataset.lonja); }
  const cl = t.closest("[data-clave]"); if (cl) { estado.clave = cl.dataset.clave; return ir("comparar"); }
  const cc = t.closest("[data-clave-cmp]"); if (cc) { estado.clave = cc.dataset.claveCmp; return router(); }
  const cat = t.closest("[data-cat]"); if (cat) { estado.cat = cat.dataset.cat; return router(); }
  const v = t.closest("[data-ir]"); if (v) return ir(v.dataset.ir);
  const fila = t.closest("[data-fila]"); if (fila) return abrirDetalle(fila.dataset.fila);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#velo").hidden) cerrarDetalle();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-fila]")) { e.preventDefault(); abrirDetalle(e.target.dataset.fila); }
});
document.addEventListener("input", e => {
  if (e.target.id === "buscar-producto") {
    estado.texto = e.target.value; const pos = e.target.selectionStart;
    router(); const b = $("#buscar-producto"); if (b) { b.focus(); b.setSelectionRange(pos, pos); }
  }
});
$("#recargar").addEventListener("click", () => cargar(true));
window.addEventListener("hashchange", router);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && DATOS) cargar(); });

if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude|anthropic/.test(location.hostname)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
cargar();
</script>
</body>
</html>
